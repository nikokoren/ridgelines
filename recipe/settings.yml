---
# Ridgelines: TRMNL recipe settings (private plugin export format, as in Downstream's recipe/src/settings.yml).
# polling_url must match recipe/polling_url.txt, which pipeline/publish.py writes.
name: Ridgelines (beta)
strategy: polling
refresh_interval: 60
polling_url: '{%- assign rl_off = trmnl.user.utc_offset | default: 0 | plus: 0 -%}{%- assign rl_day = "now" | date: "%s" | plus: rl_off | divided_by: 86400 -%}{%- assign rl_t = area | join: "," -%}{%- assign rl_s = "" -%}{%- if rl_t contains "europe" -%}{%- assign rl_s = rl_s | append: "europe," -%}{%- endif -%}{%- if rl_t contains "americas" -%}{%- assign rl_s = rl_s | append: "americas," -%}{%- endif -%}{%- if rl_s == "" -%}{%- assign rl_s = "europe,americas," -%}{%- endif -%}{%- assign rl_l = rl_s | split: "," -%}{%- assign rl_k = rl_l.size -%}{%- assign rl_j = rl_day | modulo: rl_k -%}{%- assign rl_a = rl_l[rl_j] -%}{%- case rl_a -%}{%- when "europe" -%}{%- assign rl_c = 365 -%}{%- when "americas" -%}{%- assign rl_c = 365 -%}{%- endcase -%}{%- assign rl_i = rl_day | divided_by: rl_k | modulo: rl_c -%}https://nikokoren.github.io/ridgelines/{{ rl_a }}/d/{{ rl_i }}.json'
polling_headers: ''
polling_verb: GET
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: nature,art
  github_url: https://github.com/nikokoren/ridgelines
  description: >-
    One real mountain range a day, drawn from above as rippled lines. Pick the areas the ranges
    come from, or none for all of them. The range changes at midnight in your time zone.<br><br>
    Terrain produced using Copernicus WorldDEM™-90 © DLR e.V. 2010-2014 and © Airbus Defence and
    Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights
    reserved. The organisations in charge of the Copernicus programme by law or by delegation do
    not incur any liability for any use of the Copernicus WorldDEM™-90. Die Organisationen, die
    kraft Gesetzes oder im Auftrag für das Copernicus-Programm zuständig sind, haften nicht für die
    Nutzung des Copernicus WorldDEM™-90.<br><br>
    Range names, highest points, heights and countries:
    <a href="https://www.wikidata.org/">Wikidata</a> (CC0).
- keyname: area
  name: Area
  field_type: select
  multiple: true
  description: Where the ranges come from. Tick one or more to take turns, a new range each day;
    with none ticked you get every area in turn. Use ⌘+click or Ctrl+click to select and deselect.
  options:
  - Europe: europe
  - Americas: americas
  - Asia and Oceania: asia
  - Africa: africa
- keyname: language
  name: Language
  field_type: select
  description: The language of the words on screen. Peak names stay in their local language.
  options:
  - English: en
  - Deutsch: de
  default: en
- keyname: units
  name: Units
  field_type: select
  description: Metric (metres) or imperial (feet), whatever the language.
  options:
  - Metric: metric
  - Imperial: imperial
  default: metric
- keyname: peak_label
  name: Peak name
  field_type: select
  description: Name the highest peak above its summit in the drawing.
  options:
  - Show: 'yes'
  - Hide: 'no'
  default: 'yes'
- keyname: info_box
  name: Info box
  field_type: select
  description: Range and country, with the highest peak and its height, bottom left.
  options:
  - Show: 'yes'
  - Hide: 'no'
  default: 'yes'
- keyname: title_bar
  name: Title bar
  field_type: select
  description: TRMNL's title bar with the plugin name and a short caption.
  options:
  - Show: 'yes'
  - Hide: 'no'
  default: 'no'
