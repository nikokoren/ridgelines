---
# Ridgelines: TRMNL recipe settings (private plugin export format, as in Downstream's recipe/src/settings.yml).
# polling_url must match recipe/polling_url.txt, which pipeline/publish.py writes.
name: Ridgelines
strategy: polling
refresh_interval: 60
polling_url: '{%- assign rl_off = trmnl.user.utc_offset | default: 0 | plus: 0 -%}{%- assign rl_day = "now" | date: "%s" | plus: rl_off | divided_by: 86400 -%}{%- assign rl_t = area | join: "," -%}{%- assign rl_s = "" -%}{%- if rl_t contains "europe" -%}{%- assign rl_s = rl_s | append: "europe," -%}{%- endif -%}{%- if rl_t contains "americas" -%}{%- assign rl_s = rl_s | append: "americas," -%}{%- endif -%}{%- if rl_t contains "asia" -%}{%- assign rl_s = rl_s | append: "asia," -%}{%- endif -%}{%- if rl_t contains "africa" -%}{%- assign rl_s = rl_s | append: "africa," -%}{%- endif -%}{%- if rl_s == "" -%}{%- assign rl_s = "europe,americas,asia,africa," -%}{%- endif -%}{%- assign rl_l = rl_s | split: "," -%}{%- assign rl_k = rl_l.size -%}{%- assign rl_j = rl_day | modulo: rl_k -%}{%- assign rl_a = rl_l[rl_j] -%}{%- case rl_a -%}{%- when "europe" -%}{%- assign rl_c = 365 -%}{%- when "americas" -%}{%- assign rl_c = 365 -%}{%- when "asia" -%}{%- assign rl_c = 365 -%}{%- when "africa" -%}{%- assign rl_c = 365 -%}{%- endcase -%}{%- assign rl_i = rl_day | divided_by: rl_k | modulo: rl_c -%}https://nikokoren.github.io/ridgelines/{{ rl_a }}/d/{{ rl_i }}.json'
polling_headers: ''
polling_verb: GET
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: nature,art
  github_url: https://github.com/nikokoren/ridgelines
  description: >-
    Discover a real mountain range every morning. Ridgelines is minimalist mountain art for your
    TRMNL: each day, satellite elevation data becomes a series of rippled, contour-like lines that
    show the shape of one real range from above.<br><br>
    Every drawing is a specific place on Earth, chosen for its terrain and its highest peak. A small
    info panel names the range, its country and its highest summit with its elevation.<br><br>
    Explore 1,460 ranges across Europe, the Americas, Asia and Oceania, and Africa. With 365 in
    each area, one area alone lasts a full year without repeats. Tick the areas you like, or none
    for all of them.<br><br>
    Made for e-ink, the clean line art stays crisp on every TRMNL screen size, in portrait or
    landscape, in black and white or greyscale. The landscape changes once a day, at midnight in
    your time zone: a quiet moment of discovery, and a new place to learn about every morning.<br><br>
    Terrain produced using Copernicus WorldDEM™-90 © DLR e.V. 2010-2014 and © Airbus Defence and
    Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights
    reserved. The organisations in charge of the Copernicus programme by law or by delegation do
    not incur any liability for any use of the Copernicus WorldDEM™-90. Die Organisationen, die
    kraft Gesetzes oder im Auftrag für das Copernicus-Programm zuständig sind, haften nicht für die
    Nutzung des Copernicus WorldDEM™-90.<br><br>
    Range names, highest points, heights and countries:
    <a href="https://www.wikidata.org/">Wikidata</a> (CC0).
  description-de: >-
    Entdecke jeden Morgen ein echtes Gebirge. Ridgelines ist minimalistische Bergkunst für deinen
    TRMNL: Jeden Tag werden Höhendaten aus Satellitenmessungen zu gewellten, höhenlinienartigen
    Linien, die die Form eines echten Gebirges von oben zeigen.<br><br>
    Jede Zeichnung ist ein bestimmter Ort der Erde, ausgewählt nach Gelände und höchstem Gipfel.
    Ein kleines Infofeld nennt das Gebirge, sein Land und seinen höchsten Gipfel mit Höhe.<br><br>
    1.460 Gebirge in Europa, Amerika, Asien und Ozeanien sowie Afrika stehen bereit. Mit 365 pro
    Region reicht eine Region allein für ein ganzes Jahr ohne Wiederholung. Wähle die Regionen, die
    dich interessieren, oder keine für alle.<br><br>
    Für E-Ink gemacht: Die klaren Linien bleiben scharf auf jeder TRMNL-Bildschirmgröße, im Hoch-
    und Querformat, in Schwarzweiß wie in Graustufen. Das Bild wechselt einmal am Tag, um
    Mitternacht in deiner Zeitzone: ein ruhiger Moment der Entdeckung und jeden Morgen ein neuer
    Ort zum Kennenlernen.<br><br>
    Terrain produced using Copernicus WorldDEM™-90 © DLR e.V. 2010-2014 and © Airbus Defence and
    Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights
    reserved. Die Organisationen, die kraft Gesetzes oder im Auftrag für das Copernicus-Programm
    zuständig sind, haften nicht für die Nutzung des Copernicus WorldDEM™-90.<br><br>
    Namen der Gebirge, höchste Gipfel, Höhen und Länder:
    <a href="https://www.wikidata.org/">Wikidata</a> (CC0).
- keyname: area
  name: Area
  field_type: select
  multiple: true
  description: Where the ranges come from. Tick one or more to take turns, a new range each day;
    with none ticked you get every area in turn. Use ⌘+click or Ctrl+click to select and deselect.
  options:
  - Europe: europe
  - Americas: americas
  - Asia and Oceania: asia
  - Africa: africa
- keyname: language
  name: Language
  field_type: select
  description: The language of the words on screen. Peak names stay in their local language.
  options:
  - English: en
  - Deutsch: de
  default: en
- keyname: units
  name: Units
  field_type: select
  description: Metric (metres) or imperial (feet), whatever the language.
  options:
  - Metric: metric
  - Imperial: imperial
  default: metric
- keyname: peak_label
  name: Peak name
  field_type: boolean
  description: Name the highest peak above its summit in the drawing.
  default: true
- keyname: info_box
  name: Info box
  field_type: boolean
  description: Range and country, with the highest peak and its height, bottom left.
  default: true
- keyname: title_bar
  name: Title bar
  field_type: boolean
  description: TRMNL's title bar with the plugin name and a short caption.
  default: false
