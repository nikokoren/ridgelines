# Build the entries of every list (beta and release areas) from Copernicus GLO-90 and Wikidata and
# deploy them to GitHub Pages. One-time setup: Settings > Pages > Build and deployment > Source:
# GitHub Actions. Runs on demand, and when a list or the build changes on main. Built entries are
# kept in the Actions cache between runs (never committed); publish.py rebuilds any entry whose
# crop or build differs.
name: site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/**
      - pipeline/**
      - recipe/polling_url.txt
      - recipe/tools/polling_url.rb
      - recipe/*.txt
      - recipe/tools/render.rb
      - .github/workflows/site.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r pipeline/requirements.txt
          sudo gem install liquid -v 5.14.0   # the runner image ships Ruby; TRMNL runs Ruby Liquid
      - name: No pipeline module named after a standard library module
        # pipeline/ is first on sys.path, so pipeline/select.py hid the stdlib select module and broke
        # http.client on the runner (run 37857147132, 2026-10-08); copy.py and site.py did the same before.
        run: python -c "import os, sys; bad = [f for f in os.listdir('pipeline') if f.endswith('.py') and f[:-3] in sys.stdlib_module_names]; sys.exit(f'rename {bad}' if bad else 0)"
      - uses: actions/cache@v4
        with:
          path: .cache/entries
          key: entries-${{ hashFiles('pipeline/entries.py', 'data/**') }}
          restore-keys: entries-
      - name: Build entries and site
        env:
          RIDGELINES_KEEP_TILES: "0"
        run: python pipeline/publish.py --skip-build
      - name: Polling URL renders the right slot in Ruby Liquid
        run: python pipeline/test_polling_url.py
      - name: Show/hide settings read right in Ruby Liquid
        run: python pipeline/test_settings.py
      - name: Polling URL unchanged
        run: git diff --exit-code recipe/polling_url.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
